# foundry.toml
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
auto_detect_solc = false
evm_version = "prague"
optimizer = false # reference semantics, not gas golf — keep codegen predictable
via_ir = false

[lint]
# The contracts are test fixtures + a solc reference (deliberately non-idiomatic: external calls
# in loops, ignored returns, string reverts); the linter notes are noise, not bugs.
lint_on_build = false
