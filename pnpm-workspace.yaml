packages:
  - packages/*
  - examples/*
  - apps/*

# Default catalog: shared runtime + toolchain pins. `viem` and `vite-plus` are exact on purpose
# (type tests depend on viem patch behavior; `vite-plus` must match the `vite` core alias and the
# `vitest` pin in `overrides` below). setup-vp reads the `vite-plus` entry to install the CI `vp`.
catalog:
  '@types/node': ^24.19.0
  abitype: ^1.3.0
  typescript: ^6.0.3
  viem: 2.57.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

catalogs:
  testing:
    prool: ^0.2.16
    '@ethereumjs/evm': ^10.1.3
  docs:
    '@astrojs/check': ^0.9.10
    '@astrojs/starlight': ^0.42.4
    '@expressive-code/plugin-collapsible-sections': ^0.44.2
    astro: ^7.3.5
    cf: 1.0.0-beta.6
    monaco-editor: ^0.57.0
    starlight-links-validator: ^0.26.0
    starlight-llms-txt: ^0.12.0
    starlight-theme-rapide: ^0.6.0
    wrangler: ^4.144.0

# pnpm >= 11 refuses versions younger than a day (minimumReleaseAge 1440) at resolution time;
# pnpm writes an exact-version exclude here when a pinned version is newer than that, and prunes
# the entries the lockfile no longer resolves.
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - miniflare@5.20260926.1-alpha
  - viem@2.57.1
  - wrangler@4.144.0
  - cf@1.0.0-beta.6

# Vite+ requires these for pnpm (viteplus.dev/guide/local-cli, "Manual Installation"; keys use
# the `@*` range so `catalog:` references stay on the catalog): one Vite (the Vite+ core) and one
# Vitest (the one `vp test` bundles, see `vp --version`) across the whole graph. Bump both with
# `vite-plus` in the testing catalog.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1

# The Vite+ core alias carries its own version (1.0.0), not Vite's 8.x, so `vite` peers such as
# vitest's or vitefu's (astro) `^… || ^8` read as unmet although the core is Vite 8.
peerDependencyRules:
  allowedVersions:
    vite: 1.0.0

# pnpm >= 11 fails the install (strictDepBuilds) on any dependency build script nobody has
# ruled on. None is needed here: esbuild (wrangler, astro) and workerd (wrangler) only verify /
# relink their prebuilt platform binary in postinstall — their JS shims resolve the
# @esbuild/* / @cloudflare/workerd-* optional package on their own.
allowBuilds:
  esbuild: false
  workerd: false
