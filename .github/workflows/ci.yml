name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # runs the mainnet-fork suite (needs the ANVIL_FORK_URL secret)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.8.1 # pinned: anvil/forge determinism

jobs:
  # One serial gate on purpose (fewer concurrent runners, no artifact plumbing):
  # contracts → build → static checks → tests → package health.
  ci:
    name: Contracts → build → check → test → package health
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # contracts/lib/forge-std
          fetch-depth: 0 # `changeset status --since` needs the base branch history
      - uses: ./.github/actions/setup
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Contracts (forge build + test) and codegen artifacts
        working-directory: packages/contracts
        run: forge build && forge test && vp run codegen

      - name: Build library
        run: vp run build

      # type-aware lint + tsgolint type-check resolve workspace imports through the built
      # .d.ts and the codegen artifacts, hence after the two steps above
      - name: Format check
        run: vp run fmt:check
      - name: Lint + type-check (oxlint / tsgolint)
        run: vp run lint:ci
      - name: Typecheck (tsc + astro check)
        run: vp run typecheck

      - name: Unit + type tests
        run: vp run test
      - name: Integration tests (anvil via prool)
        run: vp run test:integration

      - name: Package health (publint + attw)
        working-directory: packages/evs
        # esm-only profile: CJSResolvesToESM is the accepted cost of shipping ESM-only;
        # attw exits 1 on ANY problem without the profile.
        run: |
          bunx publint
          bunx @arethetypeswrong/cli --pack . --profile esm-only

      # Informational (continue-on-error): tooling-only PRs legitimately have no changeset.
      - name: Changeset present?
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: bunx changeset status --since origin/main
        continue-on-error: true

  # Manual (workflow_dispatch) mainnet-fork suite; add a `schedule:` trigger to run it periodically.
  fork-tests:
    name: Mainnet-fork suite (scheduled / manual)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # the integration suite imports gitignored test/generated/ artifacts — regenerate them
      - name: Build contracts (reference + mocks)
        working-directory: packages/contracts
        run: forge build && vp run codegen
      - name: Fork integration
        env:
          ANVIL_FORK_URL: ${{ secrets.ANVIL_FORK_URL }}
        run: vp run test:integration
