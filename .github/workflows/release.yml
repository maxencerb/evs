# Changesets-driven release. Every push to main either
#   (a) opens/updates the "Version Packages" PR (changesets found), or
#   (b) publishes @maxencerb/evs (no changesets, package.json version not on npm yet)
#       via npm OIDC trusted publishing, then tags + creates the GitHub release.
#
# The filename MUST stay `release.yml`: it is the workflow the npm trusted publisher is
# configured against (npmjs.com → @maxencerb/evs → Trusted publishing).
name: Release

on:
  push:
    branches: [main]

# reset, then grant per job — id-token: write only where npm publish runs
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select changesets mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Open / update "Version Packages" PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump (pushed through the GitHub API)
      pull-requests: write # create / update the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # changeset version + `bun install --lockfile-only` so bun.lock's workspace
          # version stays in sync (a stale lock breaks `bun pm pack`, oven-sh/bun#20477)
          script: vp run changeset:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  publish:
    name: Publish @maxencerb/evs to npm (OIDC)
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag + create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # contracts/lib/forge-std (release re-runs the full gate)
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1 # keep in sync with ci.yml

      # npm >= 11.5.1 is required for OIDC; Node 24 (from .node-version) bundles >= 11.13.
      # Node's own npm is used on purpose — `bun publish` has no OIDC support (oven-sh/bun#22423).
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Full gate (contracts, build, check, tests)
        run: |
          (cd packages/contracts && forge build && forge test && vp run codegen)
          vp run build
          vp run check
          vp run test
          vp run test:integration

      # scripts/publish.ts: `bun pm pack` (rewrites catalog:/workspace: specs) →
      # `npm publish <tgz> --provenance` (OIDC) → `changeset git-tag`. The action reads the
      # tag events (CHANGESETS_OUTPUT), pushes the tag and creates the GitHub release.
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run changeset:publish
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: '' # nothing must shadow OIDC (npm-oidc-release.md §2)
