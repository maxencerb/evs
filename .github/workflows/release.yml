# Changesets-driven release. Every push to main either
#   (a) opens/updates the "Version Packages" PR (changesets found), or
#   (b) publishes every package whose package.json version is not on npm yet
#       (@maxencerb/evs, @maxencerb/vite-plugin-evs; no changesets left) via npm OIDC trusted
#       publishing, then tags + creates the GitHub releases.
#
# The filename MUST stay `release.yml`: it is the workflow the npm trusted publisher of EACH
# published package is configured against (npmjs.com → the package → Trusted publishing).
name: Release

on:
  push:
    branches: [main]

# reset, then grant per job — id-token: write only where npm publish runs
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select changesets mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Open / update "Version Packages" PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump (pushed through the GitHub API)
      pull-requests: write # create / update the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # plain `changeset version`: pnpm-lock.yaml links workspace packages without recording
          # their version, so a bump needs no lockfile resync
          script: vp run changeset:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  publish:
    name: Publish to npm (OIDC)
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag + create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # contracts/lib/forge-std (release re-runs the full gate)
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3 # keep in sync with ci.yml

      - name: Full gate (contracts, build, check, tests)
        run: |
          (cd packages/contracts && forge build && forge test && vp run codegen)
          vp run build
          vp run check
          vp run test
          vp run test:integration
          (cd examples/vite-precompile && vp run build)
          for package in packages/evs packages/vite-plugin-evs; do
            (cd "$package" && vp exec publint && vp exec attw --pack . --profile esm-only)
          done

      # `changeset publish` (changesets CLI 3) publishes with the workspace's package manager:
      # `pnpm publish --access public --tag <latest|pre tag> --no-git-checks` for every package
      # whose version is not on npm yet. pnpm >= 11 publishes natively (no npm CLI) and does the
      # OIDC trusted-publishing exchange itself (ACTIONS_ID_TOKEN_REQUEST_* from `id-token:
      # write`; no token anywhere), attaches sigstore provenance automatically for a public repo +
      # public package, and rewrites `catalog:` / `workspace:` specs in the packed manifest.
      # Each package's `prepublishOnly` rebuilds its dist/ with `vp pack`. It then creates one
      # `<name>@X.Y.Z` tag per published package and reports them through CHANGESETS_OUTPUT (set
      # by the action, passed through `vp run`); the action pushes the tags and creates the
      # GitHub releases.
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run changeset:publish
          create-github-releases: true
