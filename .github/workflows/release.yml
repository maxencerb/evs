# Changesets-driven release. Every push to main either
#   (a) opens/updates the "Version Packages" PR (changesets found), or
#   (b) publishes @maxencerb/evs (no changesets, package.json version not on npm yet)
#       via npm OIDC trusted publishing, then tags + creates the GitHub release.
#
# The filename MUST stay `release.yml`: it is the workflow the npm trusted publisher is
# configured against (npmjs.com → @maxencerb/evs → Trusted publishing).
name: Release

on:
  push:
    branches: [main]

# reset, then grant per job — id-token: write only where npm publish runs
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select changesets mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Open / update "Version Packages" PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump (pushed through the GitHub API)
      pull-requests: write # create / update the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # plain `changeset version`: pnpm-lock.yaml links workspace packages without recording
          # their version, so a bump needs no lockfile resync
          script: vp run changeset:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  publish:
    name: Publish @maxencerb/evs to npm (OIDC)
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag + create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # contracts/lib/forge-std (release re-runs the full gate)
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3 # keep in sync with ci.yml

      - name: Full gate (contracts, build, check, tests)
        run: |
          (cd packages/contracts && forge build && forge test && vp run codegen)
          vp run build
          vp run check
          vp run test
          vp run test:integration
          (cd packages/evs && vp exec publint && vp exec attw --pack . --profile esm-only)

      # `changeset publish` (changesets CLI 3) publishes with the workspace's package manager:
      # `pnpm publish --access public --tag <latest|pre tag> --no-git-checks` for every package
      # whose version is not on npm yet. pnpm >= 11 publishes natively (no npm CLI) and does the
      # OIDC trusted-publishing exchange itself (ACTIONS_ID_TOKEN_REQUEST_* from `id-token:
      # write`; no token anywhere), attaches sigstore provenance automatically for a public repo +
      # public package, and rewrites `catalog:` / `workspace:` specs in the packed manifest.
      # `prepublishOnly` rebuilds dist/ with `vp pack`. It then creates the
      # `@maxencerb/evs@X.Y.Z` tag and reports it through CHANGESETS_OUTPUT (set by the action,
      # passed through `vp run`); the action pushes the tag and creates the GitHub release.
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run changeset:publish
          create-github-releases: true

      # pnpm skips (with a warning, not an error) provenance it cannot attach; fail loudly
      # instead so a release without an attestation is noticed.
      - name: Verify the published version carries provenance
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const sleep = (ms) => Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, ms);
            for (const { name, version } of JSON.parse(process.env.PUBLISHED)) {
              let att = null;
              // the registry metadata can lag the publish by a few seconds: until the packument
              // lists the version, `npm view` exits 1 with E404 — retry that, rethrow anything
              // else. `--prefer-online` revalidates the packument instead of trusting npm cache.
              for (let i = 0; i < 12 && !att?.provenance; i++) {
                if (i > 0) sleep(10_000);
                let out;
                try {
                  out = execFileSync(
                    "npm",
                    ["view", `${name}@${version}`, "dist.attestations", "--json", "--prefer-online"],
                    { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] },
                  );
                } catch (err) {
                  if (!`${err.stdout ?? ""}${err.stderr ?? ""}`.includes("E404")) {
                    process.stderr.write(err.stderr ?? "");
                    throw err;
                  }
                  console.log(`${name}@${version}: not on the registry yet (E404), attempt ${i + 1}/12`);
                  out = "";
                }
                att = out.trim() ? JSON.parse(out) : null;
              }
              if (!att?.provenance) throw new Error(`${name}@${version}: no provenance attestation on npm`);
              console.log(`${name}@${version}: provenance ${att.provenance.predicateType}`);
            }
          '
