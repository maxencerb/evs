name: Setup Vite+ (node + pnpm) and Bun, then install
description: >
  Install the Vite+ CLI (version resolved from the `vite-plus` entry of the pnpm-workspace.yaml
  catalog), the Node.js from .node-version and the pnpm pinned in `packageManager`, restore the
  pnpm store cache, then `vp install --frozen-lockfile`. Also install Bun, for `bun check`.

runs:
  using: composite
  steps:
    # setup-vp replaces pnpm/action-setup + setup-node + actions/cache: vp provisions Node.js and
    # the package manager, and `cache: true` caches the pnpm store keyed on pnpm-lock.yaml.
    - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version-file: .node-version
        cache: true
        run-install: |
          args: ['--frozen-lockfile']
    # `bun check` is one of the type checkers `vp run typecheck:checkers` runs. Pinned: the
    # checker ships inside Bun, so another Bun is another checker.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
